name: Approve coordinated James release
run-name: Approve James ${{ inputs.tag }} from run ${{ inputs.run }}
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      source:
        required: true
        type: string
      run:
        required: true
        type: string
      artifact-id:
        required: true
        type: string
      artifact-digest:
        required: true
        type: string
      candidate-id:
        required: true
        type: string
      candidate-digest:
        required: true
        type: string
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production-release
    concurrency:
      group: james-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Promote only the approved, unchanged, cold-qualified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_KEY: ${{ vars.CYBEX_JAMES_UPDATE_TRUSTED_PUBLIC_KEY }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.source }}
          RUN: ${{ inputs.run }}
          COLD_ID: ${{ inputs.artifact-id }}
          COLD_DIGEST: ${{ inputs.artifact-digest }}
          CANDIDATE_ID: ${{ inputs.candidate-id }}
          CANDIDATE_DIGEST: ${{ inputs.candidate-digest }}
        run: |
          python3 -B nixos-appliance/qualification/promote-production-release.py \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --source "$SOURCE" --run "$RUN" \
            --artifact-id "$COLD_ID" --artifact-digest "$COLD_DIGEST" \
            --candidate-id "$CANDIDATE_ID" --candidate-digest "$CANDIDATE_DIGEST" \
            --trusted-public-key "$TRUSTED_KEY"
