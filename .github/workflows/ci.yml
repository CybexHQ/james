name: CI

on:
  pull_request:
  push:
    branches: ["main", "james-nixos"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Verify Python producer with Rust installer
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
          cargo test --locked python_packer_archive_verifies_and_extracts_in_rust -- --ignored

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  scripts:
    name: Appliance and release contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base ripgrep shellcheck zstd

      - name: Bash syntax
        shell: bash
        run: |
          mapfile -t nixos_helpers < <(rg -l '^#!.*(bash|/sh)$' nixos-appliance | sort)
          for helper in "${nixos_helpers[@]}"; do bash -n "$helper"; done

      - name: Shellcheck
        shell: bash
        run: |
          mapfile -t nixos_helpers < <(rg -l '^#!.*(bash|/sh)$' nixos-appliance | sort)
          if ((${#nixos_helpers[@]})); then shellcheck "${nixos_helpers[@]}"; fi

      - name: NixOS Python syntax
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          for path in Path('nixos-appliance').rglob('*'):
              if path.is_file() and (path.suffix == '.py' or path.read_bytes().startswith(b'#!/usr/bin/env python3')):
                  compile(path.read_bytes(), str(path), 'exec')
          PY

      - name: Release tooling tests
        run: python3 -B -m unittest discover -s tools/tests -v

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Check sqlx MySQL feature is inactive
        run: |
          cargo tree -i sqlx-mysql 2>&1 | tee /tmp/sqlx-mysql-tree.txt
          grep -q "nothing to print" /tmp/sqlx-mysql-tree.txt

      - name: Audit dependencies
        run: cargo audit --ignore RUSTSEC-2023-0071
