name: Nest Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  contracts:
    name: Installer and release contracts
    environment: production-release
    runs-on: [self-hosted, linux, x64, cybex-james-lab]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native checks
        run: |
          command -v cc
          command -v dnsmasq
          command -v rg
          command -v shellcheck

      - name: Bash syntax
        shell: bash
        run: |
          mapfile -t appliance_helpers < <(rg -l '^#!.*(bash|/sh)$' nixos-appliance/runtime | sort)
          bash -n release/beast/*.sh nixos-appliance/*.sh "${appliance_helpers[@]}"

      - name: Shellcheck
        shell: bash
        run: |
          mapfile -t appliance_helpers < <(rg -l '^#!.*(bash|/sh)$' nixos-appliance/runtime | sort)
          shellcheck release/beast/*.sh nixos-appliance/*.sh "${appliance_helpers[@]}"

      - name: Python helper syntax
        run: python3 -m py_compile nixos-appliance/*.py tools/pack-system-closure.py tools/system_closure.py

      - name: NixOS appliance pinned-base contract
        run: python3 -B -m unittest discover -s nixos-appliance/tests -v

      - name: Appliance and release tests
        run: python3 -B -m unittest discover -s tools/tests -v

  rust-release:
    name: Rust production release gate
    environment: production-release
    env:
      CARGO_TARGET_DIR: /home/john/.local/state/tiaris-nest-ci-target/release-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64, cybex-james-lab]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Audit the dependencies before signing a production release
        run: |
          cargo audit --version
          cargo tree -i sqlx-mysql 2>&1 | tee /tmp/sqlx-mysql-tree.txt
          grep -q "nothing to print" /tmp/sqlx-mysql-tree.txt
          cargo audit --ignore RUSTSEC-2023-0071

  nix:
    name: Pinned workstation netboot
    environment: production-release
    runs-on: [self-hosted, linux, x64, cybex-james-lab]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify installed local Nix
        run: nix-instantiate --version

      - name: Parse workstation expressions
        run: |
          nix-instantiate --parse release/workstation-netboot.nix >/dev/null
          nix-instantiate --parse release/release-tools.nix >/dev/null
          for expression in nixos-appliance/*.nix; do nix-instantiate --parse "$expression" >/dev/null; done

  release_build:
    name: Build and sign release candidate once
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, rust-release, nix]
    runs-on: [self-hosted, linux, x64, cybex-james-lab]
    environment: production-release
    timeout-minutes: 240
    concurrency:
      group: nest-local-candidate-build
      cancel-in-progress: false
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      coordinated: ${{ steps.release-version.outputs.coordinated }}
      manage_origin: ${{ steps.release-version.outputs.manage_origin }}
      artifact_id: ${{ steps.release-artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.release-artifact.outputs.artifact_digest }}
      artifact_name: ${{ steps.release-artifact.outputs.artifact_name }}
      workstation_bundle_name: ${{ steps.workstation-source.outputs.bundle_name }}
      has_predecessor: ${{ steps.published-predecessor.outputs.exists }}
      predecessor_identity_b64: ${{ steps.published-predecessor.outputs.identity_b64 }}
      predecessor_identity_sha256: ${{ steps.published-predecessor.outputs.identity_sha256 }}
      predecessor_release: ${{ steps.published-predecessor.outputs.release_id }}
      predecessor_snapshot: ${{ steps.published-predecessor.outputs.snapshot_id }}
      predecessor_system_closure: ${{ steps.published-predecessor.outputs.system_closure_sha256 }}
      predecessor_update_contract: ${{ steps.published-predecessor.outputs.update_contract }}
    permissions:
      contents: read
      actions: read
    env:
      TIARIS_NEST_BUILD_MANAGE_ORIGIN: ${{ vars.CYBEX_JAMES_BUILD_MANAGE_ORIGIN }}
      TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY: ${{ vars.CYBEX_JAMES_UPDATE_TRUSTED_PUBLIC_KEY }}
      TIARIS_NEST_PROVISIONING_PUBLIC_KEYS: ${{ vars.CYBEX_JAMES_PROVISIONING_PUBLIC_KEYS }}
      TIARIS_NEST_RELEASE_ARTIFACT: tiaris-nest-release-candidate-${{ github.run_id }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate governed release inputs
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "v$version" = "$GITHUB_REF_NAME"
          python3 tools/coordinated-release.py validate >> "$GITHUB_OUTPUT"
          test -n "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY"
          test -n "$TIARIS_NEST_PROVISIONING_PUBLIC_KEYS"
          python3 tools/nest-release.py validate-manage-origin \
            --expected-manage-origin "$TIARIS_NEST_BUILD_MANAGE_ORIGIN"
          python3 tools/nest-release.py validate-public-key \
            --trusted-public-key "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY"
          mapfile -t provisioning_keys < <(printf '%s\n' "$TIARIS_NEST_PROVISIONING_PUBLIC_KEYS" | sed '/^[[:space:]]*$/d')
          test "${#provisioning_keys[@]}" -ge 1
          test "${#provisioning_keys[@]}" -le 8
          test "$(printf '%s\n' "${provisioning_keys[@]}" | LC_ALL=C sort -u | wc -l)" -eq "${#provisioning_keys[@]}"
          diff -u \
            <(printf '%s\n' "${provisioning_keys[@]}") \
            <(printf '%s\n' "${provisioning_keys[@]}" | LC_ALL=C sort)
          for key in "${provisioning_keys[@]}"; do
            python3 tools/nest-release.py validate-public-key --trusted-public-key "$key"
          done
          printf 'version=%s\nmanage_origin=%s\n' \
            "$version" "$TIARIS_NEST_BUILD_MANAGE_ORIGIN" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned workstation source
        id: workstation-source
        shell: bash
        run: |
          set -euo pipefail
          repository="$(jq -er '.repository' release/workstation-netboot-source.json)"
          revision="$(jq -er '.revision' release/workstation-netboot-source.json)"
          runtime_version="$(jq -er '.runtime_version' release/workstation-netboot-source.json)"
          nixpkgs_revision="$(sed -n 's/^[[:space:]]*revision = "\([0-9a-f]*\)";.*/\1/p' release/nixpkgs.nix)"
          [[ "$repository" = "CybexHQ/development" ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          # release/nixpkgs.nix is the only source of the reviewed revision.
          [[ "$nixpkgs_revision" =~ ^[0-9a-f]{40}$ ]]
          grep -Fqx "  url = \"https://github.com/NixOS/nixpkgs/archive/${nixpkgs_revision}.tar.gz\";" release/nixpkgs.nix
          [[ "$runtime_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]
          bundle_name="tiaris-workstation-netboot-${runtime_version}-${revision:0:12}-x86_64-linux.tar.zst"
          printf 'repository=%s\nrevision=%s\nruntime_version=%s\nnixpkgs_revision=%s\nbundle_name=%s\n' \
            "$repository" "$revision" "$runtime_version" "$nixpkgs_revision" "$bundle_name" \
            >> "$GITHUB_OUTPUT"

      - name: Require repository immutable-release policy
        shell: bash
        env:
          # The sealed secret keeps its pre-rename storage key until it is rotated.
          GH_TOKEN: ${{ secrets.CYBEX_FORGE_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?configure TIARIS_NEST_RELEASE_POLICY_TOKEN with repository Administration read permission}"
          immutable_enabled="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"
          if [ "$immutable_enabled" != "true" ]; then
            echo "::error::Repository immutable releases must be enabled before a production release"
            exit 1
          fi

      - name: Select the build-once candidate artifact
        id: release-candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          response="$RUNNER_TEMP/tiaris-nest-run-artifacts.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$TIARIS_NEST_RELEASE_ARTIFACT&per_page=100" \
            > "$response"
          count="$(jq '[.artifacts[] | select(.expired == false)] | length' "$response")"
          case "$count" in
            0)
              python3 tools/local-candidate.py select >> "$GITHUB_OUTPUT"
              ;;
            1)
              test "$(python3 tools/local-candidate.py select)" = reuse=true
              artifact="$(jq -c '.artifacts[] | select(.expired == false)' "$response")"
              artifact_id="$(jq -r '.id' <<<"$artifact")"
              digest="$(jq -r '.digest' <<<"$artifact")"
              test "$(jq -r '.name' <<<"$artifact")" = "$TIARIS_NEST_RELEASE_ARTIFACT"
              test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$GITHUB_RUN_ID"
              test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "${GITHUB_SHA,,}"
              [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              printf 'reuse=true\nartifact_id=%s\nartifact_digest=%s\n' \
                "$artifact_id" "${digest#sha256:}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::More than one unexpired release candidate exists for this workflow run"
              exit 1
              ;;
          esac
          printf 'artifact_name=%s\n' "$TIARIS_NEST_RELEASE_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact pinned Manage source
        if: steps.release-candidate.outputs.reuse != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.workstation-source.outputs.repository }}
          ref: ${{ steps.workstation-source.outputs.revision }}
          path: manage-source
          fetch-depth: 0
          persist-credentials: false
          # The sealed secret keeps its pre-rename storage key until it is rotated.
          ssh-key: ${{ secrets.CYBEX_DEVELOPMENT_SOURCE_SSH_KEY }}

      - name: Verify pinned Manage source and runtime version
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C manage-source rev-parse HEAD)" = "${{ steps.workstation-source.outputs.revision }}"
          test -z "$(git -C manage-source status --porcelain)"
          test "$(tr -d '\n' < manage-source/deploy/nixos/workstation-netboot-version)" = "${{ steps.workstation-source.outputs.runtime_version }}"
          python3 tools/nest-release.py verify-component-compatibility \
            --nest-compatibility protocol/compatibility.json \
            --manage-compatibility manage-source/protocol/compatibility.json
          test "$(jq -er '.workstation_runtime.compatibility_epoch' protocol/compatibility.json)" = 1

      - name: Validate private signing key for a new candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        env:
          # The sealed secret keeps its pre-rename storage key until it is rotated.
          TIARIS_NEST_RELEASE_PRIVATE_KEY_B64: ${{ secrets.CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$TIARIS_NEST_RELEASE_PRIVATE_KEY_B64"

      - name: Audit the pinned workstation agent before building its runtime
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        run: |
          cargo audit --version
          cargo audit --file manage-source/agent/tiaris-agent/Cargo.lock

      - name: Require local release tools
        run: |
          for tool in docker jq zstd openssl gh; do command -v "$tool"; done
          python3 tools/local-candidate.py prune

      - name: Download retained candidate receipt
        if: steps.release-candidate.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/local-candidate.py download-receipt \
            --artifact-id "${{ steps.release-candidate.outputs.artifact_id }}" \
            --artifact-digest "${{ steps.release-candidate.outputs.artifact_digest }}" \
            --receipt candidate-receipt/candidate.json

      - name: Restore exact local bytes without rebuilding or signing
        if: steps.release-candidate.outputs.reuse == 'true'
        run: |
          arguments=()
          if [ -f candidate-receipt/candidate.json ]; then
            arguments+=(--receipt candidate-receipt/candidate.json)
          fi
          python3 tools/local-candidate.py restore "${arguments[@]}"

      - name: Resolve and authenticate production predecessor
        id: published-predecessor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          directory="$RUNNER_TEMP/tiaris-nest-predecessor"
          identity="$RUNNER_TEMP/tiaris-nest-published-predecessor.json"
          install -d -m 0755 dist
          arguments=()
          if [ "${{ steps.release-candidate.outputs.reuse }}" = true ]; then
            arguments+=(--expected-identity dist/tiaris-nest-build-predecessor.json)
          fi
          python3 -B nixos-appliance/qualification/release_predecessor.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-version "${{ steps.release-version.outputs.version }}" \
            --trusted-public-key "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY" \
            --directory "$directory" --output "$identity" \
            --github-output "$GITHUB_OUTPUT" "${arguments[@]}"
          if [ -f "$identity" ]; then
            if [ -f "$directory/tiaris-nest-release-compatibility.json" ]; then
              install -m 0444 "$directory/tiaris-nest-release-compatibility.json" \
                "$RUNNER_TEMP/tiaris-nest-previous-release-compatibility.json"
            fi
            if [ "${{ steps.release-candidate.outputs.reuse }}" != true ]; then
              install -m 0444 "$identity" dist/tiaris-nest-build-predecessor.json
            fi
          fi

      - name: Build exact binaries, appliance media, and workstation runtime
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.release-version.outputs.version }}
          BUILD_BUNDLE: ${{ steps.workstation-source.outputs.bundle_name }}
          BUILD_RUNTIME: ${{ steps.workstation-source.outputs.runtime_version }}
          BUILD_MANAGE_REVISION: ${{ steps.workstation-source.outputs.revision }}
          BUILD_NIXPKGS_REVISION: ${{ steps.workstation-source.outputs.nixpkgs_revision }}
          BUILD_HAS_PREDECESSOR: ${{ steps.published-predecessor.outputs.exists }}
        run: |
          source tools/ci-host-reservation.sh
          reserve_ci_host_capacity "Nest build $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 48 12
          python3 tools/beast-build.py <<'BUILD'
          set -euo pipefail
          version="$BUILD_VERSION"
          TIARIS_NEST_BUILD_MANAGE_ORIGIN="$TIARIS_NEST_BUILD_MANAGE_ORIGIN" \
            cargo build --release --locked --bin tiaris-nest --bin tiaris-nest-bootstrap
          source_epoch="$(git -C manage-source show -s --format=%ct HEAD)"
          [[ "$source_epoch" =~ ^[1-9][0-9]*$ ]]
          nix-build release/workstation-netboot.nix \
            --arg manageRepo ./manage-source \
            --arg sourceDateEpoch "$source_epoch" \
            --out-link result-workstation-netboot
          install -d -m 0755 dist
          install -m 0755 target/release/tiaris-nest dist/tiaris-nest-x86_64-linux
          install -m 0755 target/release/tiaris-nest-bootstrap "$RUNNER_TEMP/tiaris-nest-bootstrap"
          test "$("$RUNNER_TEMP/tiaris-nest-bootstrap" required-manage-origin)" = \
            "$TIARIS_NEST_BUILD_MANAGE_ORIGIN"
          staging="$RUNNER_TEMP/tiaris-workstation-netboot-tree"
          install -d -m 0755 "$staging"
          for component in manifest.json bzImage initrd nix-store.squashfs; do
            install -m 0644 "result-workstation-netboot/$component" "$staging/$component"
            touch --date="@$source_epoch" "$staging/$component"
          done
          nix-shell release/release-tools.nix --run \
            "bash manage-source/deploy/nixos/check-installer-netboot-release.sh --inspect-only --bundle-tree '$staging'"
          bundle="dist/$BUILD_BUNDLE"
          nix-shell release/release-tools.nix --run \
            "tar --format=ustar --sort=name --numeric-owner --owner=0 --group=0 --mode=u=rw,go=r --mtime=@$source_epoch -C '$staging' -cf - bzImage initrd manifest.json nix-store.squashfs | zstd -19 --threads=1 --no-progress --no-dictID -o '$bundle'"
          python3 tools/nest-release.py inspect-workstation-netboot \
            --workstation-netboot-bundle "$bundle" \
            --workstation-netboot-tree "$staging" \
            --workstation-netboot-url "https://github.invalid/$GITHUB_REF_NAME/$BUILD_BUNDLE" \
            --workstation-netboot-runtime-version "$BUILD_RUNTIME" \
            --workstation-netboot-manage-revision "$BUILD_MANAGE_REVISION" \
            --workstation-netboot-nixpkgs-revision "$BUILD_NIXPKGS_REVISION"
          mapfile -t provisioning_keys < <(printf '%s\n' "$TIARIS_NEST_PROVISIONING_PUBLIC_KEYS" | sed '/^[[:space:]]*$/d')
          template_args=()
          for key in "${provisioning_keys[@]}"; do
            template_args+=(--provisioning-public-key "$key")
          done
          build_args=(
            --manage-source-dir "$PWD/manage-source"
            --manage-source-revision "$BUILD_MANAGE_REVISION"
            --source-revision "$(git rev-parse HEAD)"
            --source-date-epoch "$source_epoch"
            --expected-manage-origin "$TIARIS_NEST_BUILD_MANAGE_ORIGIN"
            --release-public-key "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY"
            "${template_args[@]}"
          )
          # The build sandbox receives public inputs only. NARInfos are signed
          # outside Nix and the container after these exact bytes are returned.
          nixos-appliance/build-closure.sh \
            --unsigned-output-dir "$RUNNER_TEMP/tiaris-nest-unsigned-closure" \
            "${build_args[@]}"
          nixos-appliance/build-template.sh \
            --output-dir "$RUNNER_TEMP/tiaris-nest-template" \
            "${build_args[@]}"
          mv "$RUNNER_TEMP/tiaris-nest-template/tiaris-nest-appliance-template-$version-x86_64-linux.iso" dist/
          mv "$RUNNER_TEMP/tiaris-nest-template/tiaris-nest-appliance-template-$version-x86_64-linux.json" \
            "$RUNNER_TEMP/tiaris-nest-appliance-template-metadata.json"
          test "$(dist/tiaris-nest-x86_64-linux --version)" = "tiaris-nest $version"
          BUILD

      - name: Sign and self-verify release manifests
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        env:
          # The sealed secret keeps its pre-rename storage key until it is rotated.
          TIARIS_NEST_RELEASE_PRIVATE_KEY_B64: ${{ secrets.CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          version="${{ steps.release-version.outputs.version }}"
          key_path="$RUNNER_TEMP/tiaris-nest-release-key.pem"
          cleanup_key() {
            if [ -f "$key_path" ]; then
              shred -u -n 1 -z -- "$key_path" || rm -f -- "$key_path"
            fi
          }
          trap cleanup_key EXIT
          umask 077
          printf '%s' "$TIARIS_NEST_RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          derived_public_key="$(python3 tools/nest-release.py public-key --private-key "$key_path")"
          test "$derived_public_key" = "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY"
          release_base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          artifact_base="$release_base/download/$GITHUB_REF_NAME"
          published_at="$(date -u -d "@$(git show -s --format=%ct HEAD)" +'%Y-%m-%dT%H:%M:%SZ')"
          personalization_offset="$(jq -er '.personalization_offset' "$RUNNER_TEMP/tiaris-nest-appliance-template-metadata.json")"
          package_delivery="$(jq -er '.package_delivery' "$RUNNER_TEMP/tiaris-nest-appliance-template-metadata.json")"
          test "$package_delivery" = system-closure-v1
          mapfile -t provisioning_keys < <(printf '%s\n' "$TIARIS_NEST_PROVISIONING_PUBLIC_KEYS" | sed '/^[[:space:]]*$/d')
          previous_compatibility_args=()
          if [ -s "$RUNNER_TEMP/tiaris-nest-previous-release-compatibility.json" ]; then
            previous_compatibility_args=(
              --previous-compatibility "$RUNNER_TEMP/tiaris-nest-previous-release-compatibility.json"
              --historical-authorization release/recovery-adoption.json
            )
          fi
          template_args=(
            --installer-iso-template "dist/tiaris-nest-appliance-template-$version-x86_64-linux.iso"
            --installer-iso-template-url "$artifact_base/tiaris-nest-appliance-template-$version-x86_64-linux.iso"
            --installer-iso-template-metadata "$RUNNER_TEMP/tiaris-nest-appliance-template-metadata.json"
            --installer-iso-template-personalization-offset "$personalization_offset"
            --installer-iso-template-package-delivery "$package_delivery"
            --expected-manage-origin "$TIARIS_NEST_BUILD_MANAGE_ORIGIN"
          )
          for key in "${provisioning_keys[@]}"; do
            template_args+=(--provisioning-public-key "$key")
          done
          python3 -B tools/pack-system-closure.py \
            --cache "$RUNNER_TEMP/tiaris-nest-unsigned-closure/cache" \
            --build-metadata "$RUNNER_TEMP/tiaris-nest-unsigned-closure/build-metadata.json" \
            --private-key "$key_path" \
            --output "dist/tiaris-nest-appliance-closure-$version-x86_64-linux.tar.zst" \
            --metadata-output "$RUNNER_TEMP/tiaris-nest-appliance-closure-metadata.json"
          python3 tools/nest-release.py manifest \
            --artifact dist/tiaris-nest-x86_64-linux \
            --artifact-url "$artifact_base/tiaris-nest-x86_64-linux" \
            --version "$version" \
            --private-key "$key_path" \
            --output dist/tiaris-nest-release.json \
            --release-url "$release_base/tag/$GITHUB_REF_NAME" \
            --notes-url "$release_base/tag/$GITHUB_REF_NAME" \
            "${template_args[@]}" \
            --appliance-source-revision "$(git rev-parse HEAD)" \
            --appliance-system-closure "dist/tiaris-nest-appliance-closure-$version-x86_64-linux.tar.zst" \
            --appliance-system-closure-metadata "$RUNNER_TEMP/tiaris-nest-appliance-closure-metadata.json" \
            --appliance-system-closure-url "$artifact_base/tiaris-nest-appliance-closure-$version-x86_64-linux.tar.zst" \
            --workstation-netboot-bundle "dist/${{ steps.workstation-source.outputs.bundle_name }}" \
            --workstation-netboot-tree "$RUNNER_TEMP/tiaris-workstation-netboot-tree" \
            --workstation-netboot-url "$artifact_base/${{ steps.workstation-source.outputs.bundle_name }}" \
            --workstation-netboot-runtime-version "${{ steps.workstation-source.outputs.runtime_version }}" \
            --workstation-netboot-manage-revision "${{ steps.workstation-source.outputs.revision }}" \
            --workstation-netboot-nixpkgs-revision "${{ steps.workstation-source.outputs.nixpkgs_revision }}" \
            --workstation-netboot-manage-source-sha256 "$(jq -er '.manage_source.sha256' "$RUNNER_TEMP/tiaris-nest-appliance-closure-metadata.json")" \
            --workstation-netboot-manage-source-size-bytes "$(jq -er '.manage_source.size_bytes' "$RUNNER_TEMP/tiaris-nest-appliance-closure-metadata.json")" \
            --published-at "$published_at"
          python3 tools/nest-release.py compatibility \
            --manifest dist/tiaris-nest-release.json \
            --manifest-url "$artifact_base/tiaris-nest-release.json" \
            --compatibility protocol/compatibility.json \
            --private-key "$key_path" \
            "${previous_compatibility_args[@]}" \
            --output dist/tiaris-nest-release-compatibility.json
          python3 tools/nest-release.py verify-compatibility \
            --asset dist/tiaris-nest-release-compatibility.json \
            --manifest dist/tiaris-nest-release.json \
            --manifest-url "$artifact_base/tiaris-nest-release.json" \
            --compatibility protocol/compatibility.json \
            --trusted-public-key "$derived_public_key"
          cleanup_key
          trap - EXIT
          (
            cd dist
            checksum_files=(
              tiaris-nest-x86_64-linux
              "tiaris-nest-appliance-template-$version-x86_64-linux.iso"
              "tiaris-nest-appliance-closure-$version-x86_64-linux.tar.zst"
              "${{ steps.workstation-source.outputs.bundle_name }}"
              tiaris-nest-release.json
              tiaris-nest-release-compatibility.json
            )
            if [ "${{ steps.published-predecessor.outputs.exists }}" = true ]; then
              checksum_files+=(tiaris-nest-build-predecessor.json)
            fi
            sha256sum -b "${checksum_files[@]}" > SHA256SUMS
          )

      - name: Seal exact signed files in the local candidate store
        run: python3 tools/local-candidate.py seal --receipt candidate-receipt/candidate.json

      - name: Upload only the bounded candidate receipt
        id: upload-release-candidate
        if: steps.release-candidate.outputs.artifact_id == ''
        # actions/upload-artifact v4.6.2; rotate only after reviewing the official tag.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.TIARIS_NEST_RELEASE_ARTIFACT }}
          path: candidate-receipt/candidate.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Bind candidate artifact identity and provenance
        id: release-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_ARTIFACT_ID: ${{ steps.release-candidate.outputs.artifact_id }}
          REUSED_ARTIFACT_DIGEST: ${{ steps.release-candidate.outputs.artifact_digest }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload-release-candidate.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.upload-release-candidate.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          artifact_id="${REUSED_ARTIFACT_ID:-$UPLOADED_ARTIFACT_ID}"
          action_digest="${REUSED_ARTIFACT_DIGEST:-$UPLOADED_ARTIFACT_DIGEST}"
          action_digest="${action_digest#sha256:}"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$action_digest" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/tiaris-nest-candidate-artifact.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
          test "$(jq -r '.name' "$metadata")" = "$TIARIS_NEST_RELEASE_ARTIFACT"
          test "$(jq -r '.expired' "$metadata")" = "false"
          test "$(jq -r '.workflow_run.id' "$metadata")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' "$metadata")" = "${GITHUB_SHA,,}"
          api_digest="$(jq -r '.digest' "$metadata")"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${api_digest#sha256:}" = "$action_digest"
          printf 'artifact_id=%s\nartifact_digest=%s\nartifact_name=%s\n' \
            "$artifact_id" "$action_digest" "$TIARIS_NEST_RELEASE_ARTIFACT" \
            >> "$GITHUB_OUTPUT"

      - name: Remove disposable workspace payloads
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/candidate-receipt" "$GITHUB_WORKSPACE/manage-source"
          rm -rf -- "$RUNNER_TEMP/tiaris-nest-unsigned-closure" "$RUNNER_TEMP/tiaris-nest-template" "$RUNNER_TEMP/tiaris-workstation-netboot-tree"
          rm -rf -- "$RUNNER_TEMP/tiaris-nest-predecessor" "$RUNNER_TEMP/tiaris-nest-qualification-predecessor" "$RUNNER_TEMP/tiaris-nest-retained-manage-source"


  # Release policy fast-v1: production releases need no warm or cold VM
  # qualification. The VM jobs run on demand from nest-vm-qualification.yml
  # (for the owner's nightly) and never gate publication or promotion.
  release_publish:
    name: Attest and stage immutable candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release_build]
    runs-on: [self-hosted, linux, x64, cybex-james-lab]
    environment: production-release
    concurrency:
      # Predecessor verification and immutable publication are one
      # repository-wide critical section. Per-tag locking permits two tags to
      # sign from the same predecessor and publish in reverse order.
      group: nest-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TIARIS_NEST_RELEASE_VERSION: ${{ needs.release_build.outputs.version }}
      TIARIS_NEST_RELEASE_ARTIFACT: ${{ needs.release_build.outputs.artifact_name }}
      TIARIS_NEST_RELEASE_ARTIFACT_ID: ${{ needs.release_build.outputs.artifact_id }}
      TIARIS_NEST_RELEASE_ARTIFACT_DIGEST: ${{ needs.release_build.outputs.artifact_digest }}
      TIARIS_NEST_WORKSTATION_BUNDLE_NAME: ${{ needs.release_build.outputs.workstation_bundle_name }}
      TIARIS_NEST_BUILD_MANAGE_ORIGIN: ${{ needs.release_build.outputs.manage_origin }}
      TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY: ${{ vars.CYBEX_JAMES_UPDATE_TRUSTED_PUBLIC_KEY }}
      TIARIS_NEST_HAS_PREDECESSOR: ${{ needs.release_build.outputs.has_predecessor }}
    steps:
      - name: Require production-bound artifacts for publication
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${TIARIS_NEST_BUILD_MANAGE_ORIGIN:-}" != https://manage.cybex.net ]; then
            echo '::error::Development-origin artifacts cannot be published or promoted as production releases.'
            exit 1
          fi

      - name: Checkout exact tag for independent verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact clean publish source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA,,}"
          test -z "$(git status --porcelain)"
          test "v$TIARIS_NEST_RELEASE_VERSION" = "$GITHUB_REF_NAME"

      - name: Require independent archive verifier
        run: command -v zstd

      - name: Validate candidate artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          validate_artifact() {
            local artifact_id="$1"
            local expected_name="$2"
            local expected_digest="$3"
            local metadata="$4"
            expected_digest="${expected_digest#sha256:}"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
            test "$(jq -r '.name' "$metadata")" = "$expected_name"
            test "$(jq -r '.expired' "$metadata")" = "false"
            test "$(jq -r '.workflow_run.id' "$metadata")" = "$GITHUB_RUN_ID"
            test "$(jq -r '.workflow_run.head_sha' "$metadata")" = "${GITHUB_SHA,,}"
            test "$(jq -r '.digest' "$metadata")" = "sha256:$expected_digest"
          }
          validate_artifact \
            "$TIARIS_NEST_RELEASE_ARTIFACT_ID" \
            "$TIARIS_NEST_RELEASE_ARTIFACT" \
            "$TIARIS_NEST_RELEASE_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/tiaris-nest-candidate-artifact.json"

      - name: Download original release candidate independently by artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/local-candidate.py download-receipt \
            --artifact-id "${{ needs.release_build.outputs.artifact_id }}" \
            --artifact-digest "${{ needs.release_build.outputs.artifact_digest }}" \
            --receipt candidate-receipt/candidate.json

      - name: Verify receipt and restore exact local candidate
        run: python3 tools/local-candidate.py restore --receipt candidate-receipt/candidate.json

      - name: Independently verify exact publish bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$TIARIS_NEST_RELEASE_VERSION"
          expected="$RUNNER_TEMP/tiaris-nest-publish-expected"
          actual="$RUNNER_TEMP/tiaris-nest-publish-actual"
          expected_names=(
            SHA256SUMS
            tiaris-nest-release-compatibility.json
            tiaris-nest-release.json
            tiaris-nest-x86_64-linux
            "tiaris-nest-appliance-template-$version-x86_64-linux.iso"
            "tiaris-nest-appliance-closure-$version-x86_64-linux.tar.zst"
            "$TIARIS_NEST_WORKSTATION_BUNDLE_NAME"
          )
          case "$TIARIS_NEST_HAS_PREDECESSOR" in
            true) expected_names+=(tiaris-nest-build-predecessor.json) ;;
            false) test ! -e dist/tiaris-nest-build-predecessor.json ;;
            *) echo 'error: invalid Nest predecessor state' >&2; exit 1 ;;
          esac
          printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort > "$expected"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          while IFS= read -r name; do
            test -f "dist/$name"
            test ! -L "dist/$name"
            chmod 0444 "dist/$name"
          done < "$expected"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          printf '%s\n' bzImage initrd manifest.json nix-store.squashfs \
            > "$RUNNER_TEMP/tiaris-workstation-archive-expected"
          tar --use-compress-program=unzstd \
            -tf "dist/$TIARIS_NEST_WORKSTATION_BUNDLE_NAME" \
            > "$RUNNER_TEMP/tiaris-workstation-archive-actual"
          diff -u \
            "$RUNNER_TEMP/tiaris-workstation-archive-expected" \
            "$RUNNER_TEMP/tiaris-workstation-archive-actual"
          test "$(tar --use-compress-program=unzstd -tvf \
            "dist/$TIARIS_NEST_WORKSTATION_BUNDLE_NAME" | awk '$1 !~ /^-rw-r--r--$/ {bad=1} END {print bad+0}')" = 0
          install -d -m 0700 "$RUNNER_TEMP/tiaris-workstation-netboot-verify"
          tar --use-compress-program=unzstd \
            -xf "dist/$TIARIS_NEST_WORKSTATION_BUNDLE_NAME" \
            -C "$RUNNER_TEMP/tiaris-workstation-netboot-verify"
          python3 -B tools/nest-release.py verify \
            --manifest dist/tiaris-nest-release.json \
            --artifact dist/tiaris-nest-x86_64-linux \
            --installer-iso-template "dist/tiaris-nest-appliance-template-$version-x86_64-linux.iso" \
            --expected-manage-origin "$TIARIS_NEST_BUILD_MANAGE_ORIGIN" \
            --appliance-system-closure "dist/tiaris-nest-appliance-closure-$version-x86_64-linux.tar.zst" \
            --workstation-netboot-bundle "dist/$TIARIS_NEST_WORKSTATION_BUNDLE_NAME" \
            --workstation-netboot-tree "$RUNNER_TEMP/tiaris-workstation-netboot-verify" \
            --trusted-public-key "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY"
          artifact_base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME"
          python3 -B tools/nest-release.py verify-compatibility \
            --asset dist/tiaris-nest-release-compatibility.json \
            --manifest dist/tiaris-nest-release.json \
            --manifest-url "$artifact_base/tiaris-nest-release.json" \
            --compatibility protocol/compatibility.json \
            --trusted-public-key "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY"
          install -m 0700 dist/tiaris-nest-x86_64-linux "$RUNNER_TEMP/tiaris-nest-release-verify"
          test "$("$RUNNER_TEMP/tiaris-nest-release-verify" --version)" = "tiaris-nest $version"
          rm -f -- "$RUNNER_TEMP/tiaris-nest-release-verify"

      - name: Require repository immutable-release policy
        shell: bash
        env:
          # The sealed secret keeps its pre-rename storage key until it is rotated.
          GH_TOKEN: ${{ secrets.CYBEX_FORGE_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?configure TIARIS_NEST_RELEASE_POLICY_TOKEN with repository Administration read permission}"
          immutable_enabled="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"
          test "$immutable_enabled" = "true"

      - name: Inspect exact immutable publication recovery
        id: publication-recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release-publication.py inspect >> "$GITHUB_OUTPUT"

      - name: Attest exact release assets
        if: steps.publication-recovery.outputs.immutable_release_id == ''
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/tiaris-nest-x86_64-linux
            dist/tiaris-nest-appliance-template-${{ env.TIARIS_NEST_RELEASE_VERSION }}-x86_64-linux.iso
            dist/tiaris-nest-appliance-closure-${{ env.TIARIS_NEST_RELEASE_VERSION }}-x86_64-linux.tar.zst
            dist/${{ env.TIARIS_NEST_WORKSTATION_BUNDLE_NAME }}
            dist/tiaris-nest-release.json
            dist/tiaris-nest-release-compatibility.json
            dist/SHA256SUMS

      - name: Remove only a stale draft for this exact tag
        if: steps.publication-recovery.outputs.immutable_release_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_tag_commit="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
            --jq '.sha')"
          test "${remote_tag_commit,,}" = "${GITHUB_SHA,,}"
          owner_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          owner_run_marker="Tiaris-Release-Workflow: $owner_run"
          owner_artifact_marker="Tiaris-Candidate-Artifact-ID: $TIARIS_NEST_RELEASE_ARTIFACT_ID"
          owner_digest_marker="Tiaris-Candidate-Artifact-SHA256: $TIARIS_NEST_RELEASE_ARTIFACT_DIGEST"
          expected_body="$(printf '%s\n%s\n%s\n%s\n%s' \
            "$owner_run_marker" \
            "$owner_artifact_marker" \
            "$owner_digest_marker" \
            "Tiaris-VM-Qualification: nightly" \
            "Tiaris-Public-Closure: required")"
          existing="$RUNNER_TEMP/tiaris-nest-existing-release.json"
          existing_pages="$RUNNER_TEMP/tiaris-nest-existing-releases.json"
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$existing_pages"
          existing_count="$(jq --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)] | length' \
            "$existing_pages")"
          test "$existing_count" -le 1
          if [ "$existing_count" -eq 1 ]; then
            jq -e --arg tag "$GITHUB_REF_NAME" \
              '.[][] | select(.tag_name == $tag)' \
              "$existing_pages" > "$existing"
            test "$(jq -r '.tag_name' "$existing")" = "$GITHUB_REF_NAME"
            test "$(jq -r '.draft' "$existing")" = "true"
            test "$(jq -r '.immutable' "$existing")" = "false"
            test "$(jq -r '.name // ""' "$existing")" = "Tiaris Nest $GITHUB_REF_NAME"
            test "$(jq -r '.body // ""' "$existing")" = "$expected_body"
            stale_id="$(jq -r '.id' "$existing")"
            [[ "$stale_id" =~ ^[1-9][0-9]*$ ]]
            stale_assets="$RUNNER_TEMP/tiaris-nest-existing-release-assets.json"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$stale_id/assets?per_page=100" \
              > "$stale_assets"
            jq -e \
              --arg binary "tiaris-nest-x86_64-linux" \
              --arg template "tiaris-nest-appliance-template-$TIARIS_NEST_RELEASE_VERSION-x86_64-linux.iso" \
              --arg closure "tiaris-nest-appliance-closure-$TIARIS_NEST_RELEASE_VERSION-x86_64-linux.tar.zst" \
              --arg netboot "$TIARIS_NEST_WORKSTATION_BUNDLE_NAME" \
              --arg manifest "tiaris-nest-release.json" \
              --arg compatibility "tiaris-nest-release-compatibility.json" \
              --arg checksums "SHA256SUMS" \
              --arg predecessor_identity "tiaris-nest-build-predecessor.json" \
              'type == "array"
               and length <= 8
               and ((map(.name) | length) == (map(.name) | unique | length))
               and all(.[].name;
                 . == $binary or . == $manifest
                 or . == $compatibility
                 or . == $template or . == $closure or . == $netboot or . == $checksums
                 or . == $predecessor_identity)' \
              "$stale_assets" >/dev/null
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$stale_id"
          fi

      - name: Create draft and attach exact assets
        if: steps.publication-recovery.outputs.immutable_release_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Policy fast-v1: no VM qualification evidence is published. The
          # notes say so explicitly; promotion replaces only the public-closure
          # marker once that check has passed.
          release_markers="$(printf '%s\n%s\n%s\n%s\n%s' \
            "Tiaris-Release-Workflow: $owner_run" \
            "Tiaris-Candidate-Artifact-ID: $TIARIS_NEST_RELEASE_ARTIFACT_ID" \
            "Tiaris-Candidate-Artifact-SHA256: $TIARIS_NEST_RELEASE_ARTIFACT_DIGEST" \
            "Tiaris-VM-Qualification: nightly" \
            "Tiaris-Public-Closure: required")"
          gh release create "$GITHUB_REF_NAME" \
            --draft --prerelease --latest=false --verify-tag --target "$GITHUB_SHA" \
            --notes "$release_markers" \
            --title "Tiaris Nest $GITHUB_REF_NAME"
          release_assets=(
            dist/tiaris-nest-x86_64-linux
            "dist/tiaris-nest-appliance-template-$TIARIS_NEST_RELEASE_VERSION-x86_64-linux.iso"
            "dist/tiaris-nest-appliance-closure-$TIARIS_NEST_RELEASE_VERSION-x86_64-linux.tar.zst"
            "dist/$TIARIS_NEST_WORKSTATION_BUNDLE_NAME"
            dist/tiaris-nest-release.json
            dist/tiaris-nest-release-compatibility.json
            dist/SHA256SUMS
          )
          if [ "$TIARIS_NEST_HAS_PREDECESSOR" = true ]; then
            release_assets+=(dist/tiaris-nest-build-predecessor.json)
          fi
          gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}"

      - name: Verify remote draft assets and publish immutably
        env:
          GH_TOKEN: ${{ github.token }}
          REATTACH_RELEASE_ID: ${{ steps.publication-recovery.outputs.immutable_release_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "$REATTACH_RELEASE_ID" ]; then
            python3 -B tools/release-publication.py inspect --expected-immutable-id "$REATTACH_RELEASE_ID"
          fi
          current_releases="$RUNNER_TEMP/tiaris-nest-current-releases.json"
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$current_releases"
          release_id="$(jq -er --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)]
             | if length == 1 then .[0].id
               else error("expected exactly one release for tag")
               end' \
            "$current_releases")"
          remote_assets="$RUNNER_TEMP/tiaris-nest-release-assets.json"
          release_asset_paths=(
            dist/tiaris-nest-x86_64-linux
            "dist/tiaris-nest-appliance-template-$TIARIS_NEST_RELEASE_VERSION-x86_64-linux.iso"
            "dist/tiaris-nest-appliance-closure-$TIARIS_NEST_RELEASE_VERSION-x86_64-linux.tar.zst"
            "dist/$TIARIS_NEST_WORKSTATION_BUNDLE_NAME"
            dist/tiaris-nest-release.json
            dist/tiaris-nest-release-compatibility.json
            dist/SHA256SUMS
          )
          if [ "$TIARIS_NEST_HAS_PREDECESSOR" = true ]; then
            release_asset_paths+=(dist/tiaris-nest-build-predecessor.json)
          fi
          expected_asset_count="${#release_asset_paths[@]}"
          remote_assets_match() {
            jq -e --argjson count "$expected_asset_count" 'length == $count' \
              "$remote_assets" >/dev/null || return 1
            for path in "${release_asset_paths[@]}"; do
              name="$(basename "$path")"
              digest="sha256:$(sha256sum "$path" | cut -d ' ' -f 1)"
              size="$(stat -c %s "$path")"
              jq -e \
                --arg name "$name" \
                --arg digest "$digest" \
                --argjson size "$size" \
                '[.[] | select(.name == $name and .digest == $digest and .size == $size)] | length == 1' \
                "$remote_assets" >/dev/null || return 1
            done
          }
          matched=false
          for _attempt in $(seq 1 20); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              > "$remote_assets"
            if remote_assets_match; then
              matched=true
              break
            fi
            sleep 3
          done
          test "$matched" = "true"
          if [ -n "$REATTACH_RELEASE_ID" ]; then
            test "$release_id" = "$REATTACH_RELEASE_ID"
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
          else
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
          fi
          # Resolve both signed authorities again under the publication lock.
          # A changed published release ancestry invalidates the run.
          predecessor="$(mktemp -d "$RUNNER_TEMP/tiaris-nest-publish-predecessor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXXXX")"
          trap 'rm -rf -- "$predecessor"' EXIT
          arguments=()
          if [ "$TIARIS_NEST_HAS_PREDECESSOR" = true ]; then
            arguments+=(--expected-identity dist/tiaris-nest-build-predecessor.json)
          fi
          python3 -B nixos-appliance/qualification/release_predecessor.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-version "$TIARIS_NEST_RELEASE_VERSION" \
            --trusted-public-key "$TIARIS_NEST_UPDATE_TRUSTED_PUBLIC_KEY" \
            --directory "$predecessor" --output "$predecessor/identity.json" \
            --current-compatibility dist/tiaris-nest-release-compatibility.json \
            "${arguments[@]}"
          if [ "$TIARIS_NEST_HAS_PREDECESSOR" != true ]; then
            test ! -e "$predecessor/identity.json"
            test ! -e dist/tiaris-nest-build-predecessor.json
          fi
          if [ -z "$REATTACH_RELEASE_ID" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          fi
          immutable=false
          for _attempt in $(seq 1 20); do
            published="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
            if [ "$(jq -r '.draft' <<<"$published")" = "false" ] \
              && [ "$(jq -r '.immutable' <<<"$published")" = "true" ]
            then
              immutable=true
              break
            fi
            sleep 3
          done
          test "$(jq -r '.draft' <<<"$published")" = "false"
          test "$(jq -r '.prerelease' <<<"$published")" = "true"
          test "$immutable" = "true"
          test "$(jq -r '.tag_name' <<<"$published")" = "$GITHUB_REF_NAME"
          python3 -B tools/release-publication.py verify-attestation
          for path in "${release_asset_paths[@]}"; do
            gh release verify-asset "$GITHUB_REF_NAME" "$path"
          done

      - name: Remove disposable workspace payloads
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/candidate-receipt" "$GITHUB_WORKSPACE/manage-source"
          rm -rf -- "$RUNNER_TEMP/tiaris-nest-unsigned-closure" "$RUNNER_TEMP/tiaris-nest-template" "$RUNNER_TEMP/tiaris-workstation-netboot-tree"
          rm -rf -- "$RUNNER_TEMP/tiaris-nest-predecessor" "$RUNNER_TEMP/tiaris-nest-qualification-predecessor" "$RUNNER_TEMP/tiaris-nest-retained-manage-source"


  release_public_closure:
    name: Verify published closure through the candidate downloader
    needs: [release_build, release_publish]
    runs-on: [self-hosted, linux, x64, cybex-james-lab]
    environment: production-release
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.public-closure-evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.public-closure-evidence.outputs.artifact-digest }}
    env:
      # Reuse compiler outputs only. Every attempt still downloads the public
      # closure, executes the exact-source qualifier and writes new evidence.
      CARGO_TARGET_DIR: /home/john/.local/state/tiaris-nest-ci-target/public-closure
      TIARIS_NEST_BUILD_MANAGE_ORIGIN: ${{ needs.release_build.outputs.manage_origin }}
    steps:
      - name: Checkout exact published source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain for public closure qualification
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          toolchain: 1.85.0

      - name: Download the bounded candidate receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/local-candidate.py download-receipt \
            --artifact-id "${{ needs.release_build.outputs.artifact_id }}" \
            --artifact-digest "${{ needs.release_build.outputs.artifact_digest }}" \
            --receipt candidate-receipt/candidate.json

      - name: Download the exact published signed manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.immutable')" = true
          install -d -m 0700 dist
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/tiaris-nest-release.json" \
            --output dist/tiaris-nest-release.json
          test "$(sha256sum dist/tiaris-nest-release.json | cut -d ' ' -f 1)" = \
            "$(jq -er '.files["tiaris-nest-release.json"].sha256' candidate-receipt/candidate.json)"

      - name: Qualify signed public closure through the candidate downloader
        shell: bash
        timeout-minutes: 60
        env:
          TRUSTED_KEY: ${{ vars.CYBEX_JAMES_UPDATE_TRUSTED_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          public_dir="$RUNNER_TEMP/tiaris-nest-public-closure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$public_dir"
          public_closure_key="$public_dir/release-public-key"
          trap 'rm -f -- "$public_closure_key"' EXIT
          printf '%s\n' "$TRUSTED_KEY" > "$public_closure_key"
          chmod 0600 "$public_closure_key"
          cargo run --release --locked --bin tiaris-nest-qualify-public-closure -- \
            --manifest dist/tiaris-nest-release.json \
            --trusted-public-key "$public_closure_key" \
            --source "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --output "$public_dir/tiaris-nest-public-closure-qualification.json"

      - name: Accept exact public closure qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B nixos-appliance/qualification/release_acceptance.py \
            --phase public-closure --manifest dist/tiaris-nest-release.json --source "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/tiaris-nest-public-closure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/tiaris-nest-public-closure-qualification.json"

      - name: Retain public closure qualification evidence
        id: public-closure-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiaris-nest-public-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/tiaris-nest-public-closure-${{ github.run_id }}-${{ github.run_attempt }}/tiaris-nest-public-closure-qualification.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove disposable workspace payloads
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/candidate-receipt"
          rm -rf -- "$RUNNER_TEMP/tiaris-nest-public-closure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  release_promote:
    if: needs.release_build.outputs.coordinated != 'true'
    name: Promote published immutable release
    needs: [release_build, release_public_closure]
    runs-on: [self-hosted, linux, x64, cybex-james-lab]
    environment: production-release
    concurrency:
      group: nest-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      TIARIS_NEST_BUILD_MANAGE_ORIGIN: ${{ needs.release_build.outputs.manage_origin }}
    steps:
      - name: Require production-bound artifacts for publication
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${TIARIS_NEST_BUILD_MANAGE_ORIGIN:-}" != https://manage.cybex.net ]; then
            echo '::error::Development-origin artifacts cannot be published or promoted as production releases.'
            exit 1
          fi

      - name: Checkout exact promotion source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate public closure and promote unchanged assets
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_KEY: ${{ vars.CYBEX_JAMES_UPDATE_TRUSTED_PUBLIC_KEY }}
          CLOSURE_ID: ${{ needs.release_public_closure.outputs.artifact_id }}
          CLOSURE_DIGEST: ${{ needs.release_public_closure.outputs.artifact_digest }}
          CANDIDATE_ID: ${{ needs.release_build.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ needs.release_build.outputs.artifact_digest }}
        run: |
          set -Eeuo pipefail
          python3 -B nixos-appliance/qualification/promote-production-release.py \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" \
            --artifact-id "$CLOSURE_ID" --artifact-digest "$CLOSURE_DIGEST" \
            --candidate-id "$CANDIDATE_ID" --candidate-digest "$CANDIDATE_DIGEST" \
            --trusted-public-key "$TRUSTED_KEY"
