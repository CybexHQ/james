PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
TrustedUserCAKeys /etc/ssh/tiaris-nest-ca.pub
AuthorizedPrincipalsFile /etc/ssh/tiaris-nest-principals
AllowUsers tiaris-support
# User certificates omit forwarding extensions by default. Management may add
# them to an explicitly approved short-lived certificate, so the daemon must
# permit the certificate to make that narrower decision.
AllowAgentForwarding yes
AllowTcpForwarding yes
GatewayPorts no
PermitTunnel no
X11Forwarding no
