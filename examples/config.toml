[server]
listen_addr = "127.0.0.1:8080"
public_base_url = "http://TIARIS_NEST_IP"

[paths]
data_dir = "/var/lib/tiaris-nest"
database_path = "/var/lib/tiaris-nest/tiaris-nest.sqlite"
boot_assets_dir = "/srv/tiaris-nest/www"
iso_dir = "/srv/tiaris-nest/www/isos"
static_dir = "/srv/tiaris-nest/www/assets"
tftp_dir = "/srv/tiaris-nest/tftp"

[auth]
admin_token = "replace-with-a-long-random-token"
cookie_name = "tiaris_admin"

[boot]
bootloader_filename = "snponly.efi"
menu_timeout_ms = 0

[build]
enabled = true
max_concurrent_builds = 2
max_build_cores = 4
minimum_memory_bytes = 17179869184
minimum_swap_bytes = 8589934592
timeout_seconds = 3600
cancel_grace_seconds = 10
max_log_bytes = 65536
max_artifact_size_bytes = 21474836480
allowed_systems = ["x86_64-linux"]
work_dir = "/var/lib/tiaris-nest/build"
output_dir = "/var/lib/tiaris-nest/build-outputs"
nix_binary = "/nix/var/nix/profiles/default/bin/nix"
manage_source_url_template = "tarball+file:///usr/share/tiaris-nest/manage-source/{revision}.tar"

# Add one or more allowlisted Nix targets before queueing production jobs.
# For generated Blueprint closure builds, flake is the nixpkgs input
# used for evaluation; pin it to the same revision used by installer media.
# [[build.targets]]
# artifact_type = "nixos_closure"
# target = "blueprint"
# system = "x86_64-linux"
# flake = "github:NixOS/nixpkgs/74cc63f702f7d60a557e152a57b40fb1fd0f72ac"
# attr = "packages.x86_64-linux.desktop-experience"

[cache]
enabled = true
root_dir = "/srv/tiaris-nest/www/cache"
signing_key_name = "tiaris-nest-cache"
private_key_path = "/var/lib/tiaris-nest/cache/cache-priv-key.pem"
public_key_path = "/var/lib/tiaris-nest/cache/cache-pub-key.pem"
max_bytes = 68719476736
retain_recent_builds = 50

[update]
# Ed25519 key used to verify signed workstation-netboot release bundles.
trusted_public_key = ""

[workstation_netboot]
allow_private_release_urls = false
# Root-owned immediate rollback. This always overrides Manage's desired lane.
multicast_emergency_disabled = false
udp_sender_path = "/usr/bin/udp-sender"

[manage]
enabled = false
api_url = "https://manage.example.com"
organization_slug = "default"
state_path = "/var/lib/tiaris-nest/state/manage-state.json"
sync_interval_seconds = 30
http_timeout_seconds = 30
